# TR Life OS web — SPA static hosting.
# Vite emits hashed assets under /assets/ (immutable) and a single index.html
# at the root, so any non-asset path falls back to index.html and React Router
# resolves the route client-side.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compression for text payloads only (images/videos are already encoded).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Basic hardening — never echo server tokens or accept TRACE.
    server_tokens off;
    if ($request_method = TRACE) { return 405; }

    # Long-lived caching for content-hashed build outputs.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else: serve the SPA entry point. index.html itself must
    # always revalidate so a fresh deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Plain-text liveness endpoint for load balancers / compose healthchecks.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never proxy /api — the frontend calls the API origin directly via
    # VITE_API_URL. If you want same-origin routing, add a proxy_pass here.
}
